apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    app: auth-service
    component: auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      initContainers:
      - name: wait-for-dns
        image: busybox:1.36
        command: ["sh", "-c", "until nslookup redis.choretwo-production.svc.cluster.local; do echo 'waiting for DNS redis'; sleep 2; done"]
      containers:
      - name: auth-service
        image: pipelinedave/auth-service:199e0eacc7e4773d68088d239b5692988f589d77
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: choretwo-secrets
              key: database-url
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: choretwo-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: choretwo-secrets
              key: postgres-password
        - name: REDIS_URL
          value: redis://redis:6379
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: choretwo-secrets
              key: jwt-secret
        - name: DEX_ISSUER_URL
          value: https://dex.stillon.top
        - name: DEX_CLIENT_ID
          value: choretwo
        - name: DEX_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: choretwo-secrets
              key: dex-client-secret
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
      restartPolicy: Always
