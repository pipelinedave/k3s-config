apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: matrix-conduit
  namespace: matrix
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/ingress.class: nginx
    description: "Ingress fuer Matrix-Homeserver (Client-Server API)"
  labels:
    app.kubernetes.io/name: matrix-conduit
    app.kubernetes.io/instance: matrix-conduit
    app.kubernetes.io/part-of: matrix-conduit
    app.kubernetes.io/managed-by: flux
spec:
  tls:
  - hosts:
    - matrix.stillon.top
    secretName: matrix-tls
  rules:
  - host: matrix.stillon.top
    http:
      paths:
      - path: /_matrix/
        pathType: Prefix
        backend:
          service:
            name: matrix-conduit
            port:
              number: 6167
      - path: /.well-known/matrix/client
        pathType: Prefix
        backend:
          service:
            name: matrix-conduit
            port:
              number: 6167
