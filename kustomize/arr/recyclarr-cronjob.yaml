apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: media-server
  labels:
    app.kubernetes.io/name: recyclarr
    app.kubernetes.io/part-of: arr-stack
spec:
  schedule: "0 4 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app.kubernetes.io/name: recyclarr
            app.kubernetes.io/part-of: arr-stack
        spec:
          containers:
            - name: recyclarr
              image: ghcr.io/hotio/recyclarr:latest
              imagePullPolicy: Always
              command:
                - /bin/sh
                - -c
                - |
                  set -e
                  echo "=== Recyclarr Sync $(date) ==="
                  echo "Syncing Radarr..."
                  recyclarr sync radarr
                  echo "Syncing Sonarr..."
                  recyclarr sync series
                  echo "=== Done ==="
              env:
                - name: RADARR_URL
                  value: "http://radarr.media-server.svc.cluster.local:7878"
                - name: RADARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr-secrets
                      key: radarr-api-key
                - name: SONARR_URL
                  value: "http://sonarr.media-server.svc.cluster.local:8989"
                - name: SONARR_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: arr-secrets
                      key: sonarr-api-key
              volumeMounts:
                - name: recyclarr-config
                  mountPath: /config/recyclarr.yml
                  subPath: recyclarr.yml
                  readOnly: true
          volumes:
            - name: recyclarr-config
              configMap:
                name: recyclarr-config
          restartPolicy: OnFailure
          nodeSelector:
            kubernetes.io/os: linux
