apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: restgeld
  namespace: flux-system
spec:
  targetNamespace: restgeld
  interval: 5m
  path: ./kustomize/restgeld
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  wait: true
  timeout: 5m
  dependsOn:
    - name: nginx-ingress
    - name: cert-manager
