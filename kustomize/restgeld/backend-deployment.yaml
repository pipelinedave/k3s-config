apiVersion: apps/v1
kind: Deployment
metadata:
  name: restgeld-backend
  labels:
    app: restgeld
    component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: restgeld
      component: backend
  template:
    metadata:
      labels:
        app: restgeld
        component: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/pipelinedave/restgeld-backend:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DB_HOST
              value: restgeld-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: restgeld-secrets
                  key: postgres-user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: restgeld-secrets
                  key: postgres-password
            - name: DB_NAME
              value: restgeld_core
            - name: DEFAULT_MONTHLY_BUDGET
              value: "450"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      restartPolicy: Always
