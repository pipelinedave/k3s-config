apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ingress.yaml
namespace: choretwo-production
commonLabels:
  environment: production

images:
- name: pipelinedave/ai-copilot-service
  newName: pipelinedave/ai-copilot-service
  newTag: 9165dcad2097085174ebb7efb7743ebd7025ca1c
- name: pipelinedave/auth-service
  newName: pipelinedave/auth-service
  newTag: 9165dcad2097085174ebb7efb7743ebd7025ca1c
- name: pipelinedave/frontend
  newName: pipelinedave/frontend
  newTag: 9165dcad2097085174ebb7efb7743ebd7025ca1c
- name: pipelinedave/monolith
  newName: pipelinedave/monolith
  newTag: 9165dcad2097085174ebb7efb7743ebd7025ca1c

patches:
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SERVER_URL
        value: "https://choretwo.stillon.top"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: FRONTEND_URL
        value: "https://choretwo.stillon.top"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: HTTPS_ONLY
        value: "true"
  target:
    kind: Deployment
    name: auth-service
