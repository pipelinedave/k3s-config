apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith
  labels:
    app: monolith
    component: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: monolith
  template:
    metadata:
      labels:
        app: monolith
    spec:
      initContainers:
      - name: wait-for-dns
        image: busybox:1.36
        command: ["sh", "-c", "until nslookup postgres.choretwo-production.svc.cluster.local; do echo 'waiting for DNS postgres'; sleep 2; done"]
      containers:
      - name: monolith
        image: pipelinedave/monolith:6ce70fbf867d08ae97e6431d8fbdba9ee3e48c8a
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 150Mi
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: choretwo-secrets
              key: database-url
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: choretwo-secrets
              key: postgres-user
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: choretwo-secrets
              key: postgres-password
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: choretwo-secrets
              key: jwt-secret
        - name: REDIS_URL
          value: redis://redis:6379
        - name: GATWAY_URL
          value: https://gotify.stillon.top
        - name: ADESSO_API_KEY
          valueFrom:
            secretKeyRef:
              name: choretwo-secrets
              key: adesso-api-key
        - name: ADESSO_HUB_URL
          value: https://adesso-ai-hub.3asabc.de/v1/chat/completions
        - name: ADESSO_MODEL
          value: deepseek-v4-flash-sovereign
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
      restartPolicy: Always
