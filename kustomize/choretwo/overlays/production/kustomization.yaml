apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ingress.yaml
namespace: choretwo-production
commonLabels:
  environment: production

images:
- name: pipelinedave/frontend
  newTag: 4eb950ecb29e17ffcd50f8d58a0b9a0364c7bb61
- name: pipelinedave/monolith
  newTag: e0891c1db3db6b1a67ff4789120bd47d0789da32
- name: pipelinedave/auth-service
  newTag: 7791e6798c298cbbb82a40062ae585e9b22a2368

patches:
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SERVER_URL
        value: "https://choretwo.stillon.top"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: FRONTEND_URL
        value: "https://choretwo.stillon.top"
  target:
    kind: Deployment
    name: auth-service
