apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
- ingress.yaml
namespace: choretwo-production
commonLabels:
  environment: production

images:
- name: pipelinedave/ai-copilot-service
  newName: pipelinedave/ai-copilot-service
  newTag: f971dde0e5dd44bef40c7ffc69bb5d69c0d4dad8
- name: pipelinedave/auth-service
  newName: pipelinedave/auth-service
  newTag: f971dde0e5dd44bef40c7ffc69bb5d69c0d4dad8
- name: pipelinedave/frontend
  newName: pipelinedave/frontend
  newTag: f971dde0e5dd44bef40c7ffc69bb5d69c0d4dad8
- name: pipelinedave/monolith
  newName: pipelinedave/monolith
  newTag: f971dde0e5dd44bef40c7ffc69bb5d69c0d4dad8

patches:
- patch: |-
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: SERVER_URL
        value: "https://choretwo.stillon.top"
    - op: add
      path: /spec/template/spec/containers/0/env/-
      value:
        name: FRONTEND_URL
        value: "https://choretwo.stillon.top"
  target:
    kind: Deployment
    name: auth-service
